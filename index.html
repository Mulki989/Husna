<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lomba Benar-Salah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--blue:#2f7de1;--red:#e23b3b;--green:#2fb35a;--orange:#f28c28;--ink:#1f2a44;--card:#fffffff2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#9fd8ff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:10;pointer-events:none}
.screen.on{display:flex}
.screen.bottom{align-items:flex-end}
.card{pointer-events:auto;background:var(--card);border-radius:24px;padding:18px 20px;max-width:520px;width:100%;box-shadow:0 10px 30px #0003;max-height:92vh;overflow:auto;touch-action:pan-y}
.screen.bottom .card{max-height:56vh}
h1{margin:0 0 4px;font-size:32px;text-align:center;line-height:1.1}
h2{margin:0 0 8px;font-size:24px;text-align:center;line-height:1.15}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:11px 14px;font:inherit;font-size:20px;font-weight:700;color:#fff;background:var(--blue);margin:8px 0;cursor:pointer;box-shadow:0 4px 0 #0002}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gray{background:#8a94a8}.btn.orange{background:var(--orange)}.btn.purple{background:#8a4fd8}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.role{border:4px solid transparent;border-radius:20px;padding:12px 8px;text-align:center;font-size:20px;font-weight:800;color:#fff;cursor:pointer;margin:6px 0 10px}
.role.sel{border-color:#ffd43b;transform:scale(1.04);box-shadow:0 0 0 3px #fff8}
.role .em{font-size:44px;display:block;line-height:1.2}
input{width:100%;font:inherit;font-size:20px;padding:9px 14px;border-radius:14px;border:3px solid #c9d3e6;margin:4px 0 8px;background:#fff;color:var(--ink)}
label{font-weight:700;font-size:16px;display:block;margin-top:4px}
.err{color:var(--red);font-weight:700;min-height:24px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 8px}
.chip{border:3px solid #c9d3e6;background:#fff;border-radius:14px;padding:5px 12px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--blue);background:#e3efff}
.chip:disabled{opacity:.4;cursor:default}
.chip.sel:disabled{opacity:1}
.muted{color:#5b6680;text-align:center;font-size:16px;margin:4px 0}
.code{font-size:46px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--blue);line-height:1.1}
.players{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.ptag{padding:4px 12px;border-radius:12px;color:#fff;font-weight:800}
.ptag.wait{background:#c9d3e6;color:#5b6680}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.item{background:#fff;border:3px solid #dfe5f0;border-radius:16px;padding:8px;text-align:center;cursor:pointer}
.item .ic{font-size:36px;line-height:1.2}.item .nm{font-weight:800;font-size:15px;line-height:1.1;min-height:34px}.item .pr{font-size:14px;color:#5b6680}
.item .btn{font-size:16px;padding:6px;margin:6px 0 0}
.item.eq{border-color:var(--green);background:#eafbef}
.wallet{text-align:center;font-weight:800;font-size:19px;margin-bottom:6px}
.res{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:8px 14px;margin:6px 0;color:#fff;font-weight:800;font-size:18px}
.note{background:#fff6d6;border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:700;text-align:center}
#hud{position:fixed;top:0;left:0;right:0;display:none;z-index:5;pointer-events:none;padding:10px;text-align:center}
#hud.on{display:block}
#qbox{display:inline-block;background:#fffffff2;border-radius:20px;padding:6px 20px 8px;box-shadow:0 6px 20px #0003;max-width:96vw}
#qtext{font-size:clamp(28px,7vw,52px);font-weight:800;line-height:1.15}
#qtext.long{font-size:clamp(20px,4.6vw,36px)}
#qsub{font-size:17px;color:#5b6680}
#lockbar{width:220px;max-width:60vw;height:14px;border-radius:7px;background:#dfe5f0;margin:6px auto 2px;overflow:hidden;display:none}
#lockfill{height:100%;width:0;background:#ffc21a}
#stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:8px;font-weight:800;font-size:17px}
.stat{background:#fffffff2;border-radius:14px;padding:3px 12px}
#big{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:6;pointer-events:none;font-size:clamp(56px,16vw,130px);font-weight:800;color:#fff;text-shadow:0 5px 0 #0005,0 0 24px #0006;text-align:center;line-height:1}
#big.on{display:flex}
#big small{display:block;font-size:.3em;margin-top:12px;color:#fff}
#joy{position:fixed;left:22px;bottom:22px;width:140px;height:140px;border-radius:50%;background:#ffffff55;border:3px solid #fffa;z-index:7;display:none;touch-action:none}
#knob{position:absolute;left:42px;top:42px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 3px 8px #0004;pointer-events:none}
#jumpBtn{position:fixed;right:26px;bottom:38px;width:96px;height:96px;border-radius:50%;background:#ffd43bdd;border:3px solid #fff;z-index:7;display:none;font:inherit;font-size:20px;font-weight:800;color:var(--ink);touch-action:none}
body.ctrl-on #joy,body.ctrl-on #jumpBtn{display:block}
#topbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px}
.ibtn{width:46px;height:46px;border-radius:50%;border:0;background:#fffe;font-size:22px;box-shadow:0 3px 8px #0003;cursor:pointer}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#1f2a44ee;color:#fff;padding:10px 18px;border-radius:14px;z-index:30;display:none;font-weight:700;max-width:90vw;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbar">
  <button class="ibtn" id="btnMusic" title="Musik">🎵</button>
  <button class="ibtn" id="btnExit" title="Keluar" style="display:none">🏠</button>
</div>

<div id="hud">
  <div id="qbox"><div id="qtext"></div><div id="qsub"></div><div id="lockbar"><div id="lockfill"></div></div></div>
  <div id="stats"><div class="stat" id="stStage"></div><div class="stat" id="stMe"></div><div class="stat" id="stOpp"></div></div>
</div>
<div id="big"></div>
<div id="joy"><div id="knob"></div></div>
<button id="jumpBtn">Lompat</button>
<div id="toast"></div>

<!-- Masuk -->
<div class="screen on" id="sLogin"><div class="card">
  <h1>Lomba Benar-Salah</h1>
  <p class="muted">Siapa yang main?</p>
  <div class="row">
    <div class="role" id="roleParent" style="background:var(--blue)"><span class="em">🧑</span>Orang Tua</div>
    <div class="role" id="roleChild" style="background:var(--red)"><span class="em">🧒</span>Anak</div>
  </div>
  <label for="inName">Nama panggilan</label>
  <input id="inName" maxlength="16" placeholder="contoh: Adik Raka" autocomplete="off">
  <label for="inKode">Kode keluarga</label>
  <input id="inKode" maxlength="20" placeholder="tanya orang tua / guru" autocomplete="off">
  <div class="err" id="loginErr"></div>
  <button class="btn green" id="btnLogin">Masuk</button>
</div></div>

<!-- Menu -->
<div class="screen bottom" id="sMenu"><div class="card">
  <h2 id="menuHello"></h2>
  <div class="wallet" id="menuWallet"></div>
  <button class="btn green" id="btnSolo">🎯 Main Solo</button>
  <div class="row">
    <button class="btn" id="btnCreate">➕ Buat Room</button>
    <button class="btn purple" id="btnJoinMenu">🔑 Gabung</button>
  </div>
  <div class="row" id="kidRow">
    <button class="btn orange" id="btnShop">🛒 Toko</button>
    <button class="btn orange" id="btnWardrobe">👕 Lemari</button>
  </div>
  <button class="btn gray" id="btnLogout">Ganti Pemain</button>
</div></div>

<!-- Gabung -->
<div class="screen bottom" id="sJoin"><div class="card">
  <h2>🔑 Gabung Room</h2>
  <p class="muted">Masukkan 4 angka dari layar lawan</p>
  <input id="inRoom" inputmode="numeric" maxlength="4" placeholder="1234" style="text-align:center;font-size:36px;letter-spacing:10px">
  <div class="err" id="joinErr"></div>
  <button class="btn green" id="btnJoin">Gabung</button>
  <button class="btn gray" id="btnJoinBack">Kembali</button>
</div></div>

<!-- Lobi -->
<div class="screen bottom" id="sLobby"><div class="card">
  <h2 id="lobbyTitle"></h2>
  <div class="code" id="lobbyCode"></div>
  <p class="muted" id="lobbyCodeHint">Bagikan kode ini ke lawan</p>
  <div class="players" id="lobbyPlayers"></div>
  <label>Level</label>
  <div class="chips" id="chipLevel"></div>
  <p class="muted" id="levelInfo"></p>
  <label>Tema arena</label>
  <div class="chips" id="chipTheme"></div>
  <div id="hcWrap"><label>Penyeimbang: start Orang Tua lebih jauh</label><div class="chips" id="chipHc"></div></div>
  <p class="muted" id="lobbyInfo"></p>
  <button class="btn green" id="btnStart">Mulai!</button>
  <button class="btn gray" id="btnLobbyBack">Kembali</button>
</div></div>

<!-- Hasil -->
<div class="screen bottom" id="sResult"><div class="card">
  <h2 id="resTitle"></h2>
  <div id="resBody"></div>
  <button class="btn green" id="btnAgain">Main Lagi</button>
  <button class="btn gray" id="btnResMenu">Menu</button>
</div></div>

<!-- Toko -->
<div class="screen bottom" id="sShop"><div class="card">
  <h2>🛒 Toko Kostum</h2>
  <div class="wallet" id="shopWallet"></div>
  <div class="grid" id="shopGrid"></div>
  <button class="btn gray" id="btnShopBack">Kembali</button>
</div></div>

<!-- Lemari -->
<div class="screen bottom" id="sWardrobe"><div class="card">
  <h2>👕 Lemari</h2>
  <p class="muted">Ketuk barang untuk memakai atau melepas</p>
  <div class="grid" id="wardGrid"></div>
  <button class="btn gray" id="btnWardBack">Kembali</button>
</div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* =========================================================
   PENGATURAN — ubah bagian ini saja
   ========================================================= */
const CONFIG = {
  // Tempel URL Web App Apps Script di antara tanda kutip.
  // Dibiarkan kosong = mode offline (data hanya di perangkat ini).
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyLw5mQR4TOfk9akYO4p_rpMtx0UJHlkjbPo7wFGE3CtoZE44iNrDy94dyIj1baBChl/exec',
  ROOM_PREFIX: 'lomba-benar-salah-sd-v1-',
  STAGES: 10,          // jumlah stage (soal) per level
  NAIK_LEVEL_MIN: 7,   // minimal jawaban benar untuk membuka level berikutnya
  POIN_BENAR: 1,
  POIN_SALAH: -0.5,
  LOCK_TIME: 1.0,      // detik berdiri di kotak sampai jawaban terkunci
  SPEED: 6.5,          // kecepatan lari karakter
};

const HANDICAP = { tanpa: 0, kecil: 2, sedang: 4, besar: 6 };
const HC_LABEL = { tanpa: 'Tanpa', kecil: 'Kecil', sedang: 'Sedang', besar: 'Besar' };
const COLORS = { parent: 0x2f7de1, parent2: 0x6aa9ff, child: 0xe23b3b, child2: 0xf28c28 };
const LEVELS = [
  { n: 1, title: 'Penjumlahan & pengurangan sampai 20', max: 20 },
  { n: 2, title: 'Penjumlahan & pengurangan sampai 40', max: 40 },
  { n: 3, title: 'Penjumlahan & pengurangan sampai 60', max: 60 },
  { n: 4, title: 'Penjumlahan & pengurangan sampai 100', max: 100 },
  { n: 5, title: 'Hitungan belanja (ribuan rupiah)', shop: true },
];
const THEMES = { taman: '🌳 Taman', pantai: '🏖️ Pantai', angkasa: '🚀 Luar Angkasa' };
const SHOP = [
  { id: 'mustache', slot: 'wajah', name: 'Kumis Lucu', price: 5, icon: '🥸' },
  { id: 'glasses', slot: 'wajah', name: 'Kacamata Hitam', price: 8, icon: '🕶️' },
  { id: 'cap', slot: 'kepala', name: 'Topi Baseball', price: 10, icon: '🧢' },
  { id: 'crown', slot: 'kepala', name: 'Mahkota', price: 25, icon: '👑' },
  { id: 'helmet', slot: 'kepala', name: 'Helm Astronot', price: 30, icon: '👨‍🚀' },
  { id: 'stripes', slot: 'baju', name: 'Baju Garis', price: 15, icon: '👕' },
  { id: 'starshirt', slot: 'baju', name: 'Baju Bintang', price: 20, icon: '⭐' },
  { id: 'bolt', slot: 'baju', name: 'Baju Petir', price: 20, icon: '⚡' },
  { id: 'backpack', slot: 'punggung', name: 'Tas Punggung', price: 30, icon: '🎒' },
  { id: 'cape', slot: 'punggung', name: 'Jubah', price: 35, icon: '🦸' },
  { id: 'wings', slot: 'punggung', name: 'Sayap', price: 45, icon: '🕊️' },
  { id: 'trailstar', slot: 'jejak', name: 'Jejak Bintang', price: 40, icon: '✨' },
  { id: 'trailrainbow', slot: 'jejak', name: 'Jejak Pelangi', price: 40, icon: '🌈' },
  { id: 'cat', slot: 'peliharaan', name: 'Kucing Kotak', price: 60, icon: '🐱' },
  { id: 'dog', slot: 'peliharaan', name: 'Anjing Kotak', price: 80, icon: '🐶' },
];
const ITEM = Object.fromEntries(SHOP.map(i => [i.id, i]));

/* ===================== Utilitas ===================== */
const $ = id => document.getElementById(id);
const fmt = n => (Math.round(n * 2) / 2).toLocaleString('id-ID');
const fmtDelta = d => (d > 0 ? '+' : '−') + fmt(Math.abs(d));
const css = hex => '#' + hex.toString(16).padStart(6, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lerpAngle = (a, b, t) => { const d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI; return a + d * t; };
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
let toastTimer;
function toast(m, ms = 2600) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', ms); }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
let bigTimer;
function bigShow(main, sub = '', color = '#fff', ms = 0) {
  const b = $('big'); b.innerHTML = esc(main) + (sub ? `<small>${esc(sub)}</small>` : '');
  b.style.color = color; b.classList.add('on'); clearTimeout(bigTimer);
  if (ms) bigTimer = setTimeout(() => b.classList.remove('on'), ms);
}
function bigHide() { clearTimeout(bigTimer); $('big').classList.remove('on'); }

/* ===================== State ===================== */
const S = { profile: null, pickRole: null, mode: 'login', theme: 'taman', level: 1, handicap: 'sedang', game: null, showT: 0, myColor: COLORS.child, oppColor: null };
const net = { peer: null, conn: null, isHost: false, code: '', remote: null };
const isRace = () => !!(net.conn && net.remote);

/* ===================== Data: lokal + Google Sheet ===================== */
const storeKey = p => 'lbs_' + p.kode + '_' + p.name.toLowerCase();
function saveLocal() {
  const p = S.profile; if (!p) return;
  try {
    localStorage.setItem(storeKey(p), JSON.stringify({ level: p.level, wallet: p.wallet, owned: p.owned, equipped: p.equipped }));
    localStorage.setItem('lbs_last', JSON.stringify({ name: p.name, kode: p.kode, role: p.role }));
  } catch (e) { }
}
function loadLocal(p) { try { const d = JSON.parse(localStorage.getItem(storeKey(p)) || 'null'); if (d) Object.assign(p, d); } catch (e) { } }
async function api(action, data) {
  if (!CONFIG.APPS_SCRIPT_URL) return null;
  try {
    const r = await fetch(CONFIG.APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, ...data }) });
    return await r.json();
  } catch (e) { console.warn('API gagal', e); return null; }
}
function savePlayer() {
  saveLocal();
  const p = S.profile; if (!p || p.role !== 'child') return;
  const worn = Object.values(p.equipped);
  api('simpanPemain', { kode: p.kode, nama: p.name, peran: 'Anak', level: p.level, poin: p.wallet, koleksi: p.owned.map(id => ({ barang: id, dipakai: worn.includes(id) })) });
}

/* ===================== Generator soal ===================== */
const BELANJA = [['pensil', 1000, 3000], ['buku', 3000, 8000], ['penghapus', 500, 2000], ['permen', 500, 1500], ['roti', 2000, 6000], ['susu', 3000, 7000], ['penggaris', 1500, 4000], ['jus', 2500, 6000]];
const rp = n => 'Rp' + n.toLocaleString('id-ID');
const harga = it => rnd(it[1] / 500, it[2] / 500) * 500;
const cap1 = s => s[0].toUpperCase() + s.slice(1);
function genShop() {
  const truth = Math.random() < 0.5;
  const off = () => (Math.random() < 0.5 ? 500 : 1000) * (Math.random() < 0.5 ? -1 : 1);
  if (Math.random() < 0.5) {
    const [a, b] = shuffle(BELANJA.slice()).slice(0, 2);
    const pa = harga(a), pb = harga(b), res = pa + pb;
    let shown = res; if (!truth) { do { shown = res + off(); } while (shown <= 0); }
    return { text: `${cap1(a[0])} ${rp(pa)} + ${b[0]} ${rp(pb)} = ${rp(shown)}`, ans: truth ? 'BENAR' : 'SALAH' };
  }
  const it = BELANJA[rnd(0, BELANJA.length - 1)];
  const p = harga(it); const uang = [5000, 10000, 20000].find(u => u > p + 500) || 20000;
  const res = uang - p;
  let shown = res; if (!truth) { do { shown = res + off(); } while (shown < 0 || shown === res); }
  return { text: `Bayar ${rp(uang)}, beli ${it[0]} ${rp(p)}. Kembalian ${rp(shown)}`, ans: truth ? 'BENAR' : 'SALAH' };
}
function genQuestion(level) {
  const L = LEVELS[level - 1];
  if (L.shop) return genShop();
  const max = L.max, lo = Math.max(3, Math.floor(max * 0.3));
  let a, b, op, res;
  if (Math.random() < 0.5) { op = '+'; res = rnd(lo, max); a = rnd(1, res - 1); b = res - a; }
  else { op = '−'; a = rnd(lo, max); b = rnd(1, a - 1); res = a - b; }
  const truth = Math.random() < 0.5;
  let shown = res;
  if (!truth) {
    const spread = max <= 20 ? 2 : max <= 60 ? 3 : 5;
    let d;
    do {
      d = rnd(1, spread) * (Math.random() < 0.5 ? -1 : 1);
      if (max >= 40 && Math.random() < 0.3) d = 10 * (Math.random() < 0.5 ? -1 : 1);
    } while (res + d < 0 || d === 0);
    shown = res + d;
  }
  return { text: `${a} ${op} ${b} = ${shown}`, ans: truth ? 'BENAR' : 'SALAH' };
}
async function makeQuestions(level) {
  let custom = [];
  const res = await api('soal', { kode: S.profile.kode, level });
  if (res && res.ok && Array.isArray(res.soal)) custom = shuffle(res.soal.map(s => ({ text: String(s.teks), ans: s.jawaban === 'BENAR' ? 'BENAR' : 'SALAH' })));
  const qs = custom.slice(0, CONFIG.STAGES);
  const seen = new Set(qs.map(q => q.text));
  let guard = 0;
  while (qs.length < CONFIG.STAGES && guard++ < 500) { const q = genQuestion(level); if (!seen.has(q.text)) { seen.add(q.text); qs.push(q); } }
  return shuffle(qs);
}

/* ===================== Dunia 3D ===================== */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);
camera.position.set(0, 2.6, 10.5);
const hemi = new THREE.HemisphereLight(0xffffff, 0x6a9a4a, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(10, 22, 12); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 70 });
scene.add(sun);
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = camera.aspect < 1 ? 75 : 55; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const M = c => new THREE.MeshLambertMaterial({ color: c });

  if (S.profile.role === 'child') { S.profile.wallet = Math.max(0, S.profile.wallet + mine.delta); saveLocal(); }
  mine.ok ? me.celebrate() : me.sad(); if (opp) (opp.ok ? remote.celebrate() : remote.sad());
  bigShow(mine.ok ? '✔ Benar!' : '✘ Salah', `${fmtDelta(mine.delta)} poin · jawabannya ${m.correct}`, mine.ok ? '#3ddc6e' : '#ff5a5a', 2100);
  $('qsub').textContent = 'Jawaban yang tepat: ' + m.correct;
  G.locked = true; G.phase = 'show'; G.showT = 2.3; updateStats();
}
function nextOrEnd() {
  const G = S.game; if (!G) return;
  if (G.i + 1 < G.qs.length) startStage(G.i + 1);
  else { if (G.race) send({ t: 'end' }); finishGame(); }
}
function finishGame() {
  const G = S.game; if (!G) return; const p = S.profile;
  S.mode = 'result'; $('hud').classList.remove('on'); setCtrl(false); $('btnExit').style.display = 'none'; bigHide();
  let unlocked = false;
  if (p.role === 'child' && G.my.correct >= CONFIG.NAIK_LEVEL_MIN && S.level === p.level && p.level < LEVELS.length) { p.level++; unlocked = true; }
  if (p.role === 'child') savePlayer();
  let title, juara;
  if (G.race) {
    const a = G.my.total, b = G.opp.total;
    if (a > b) { title = '🏆 Kamu juara!'; juara = p.name; } else if (b > a) { title = '🏆 Juara: ' + net.remote.name; juara = net.remote.name; } else { title = '🤝 Seri!'; juara = 'Seri'; }
    a >= b ? me.celebrate() : me.sad(); b >= a ? remote.celebrate() : remote.sad();
  } else { title = G.my.correct >= CONFIG.NAIK_LEVEL_MIN ? '🎉 Hebat!' : '💪 Ayo coba lagi!'; juara = p.name; }
  $('resTitle').textContent = title;
  const row = (name, color, d) => `<div class="res" style="background:${css(color)}"><span>${esc(name)}</span><span>✔ ${d.correct}/${G.qs.length} · ${fmt(d.total)} poin</span></div>`;
  let html = row(p.name, S.myColor, G.my);
  if (G.race && net.remote) html += row(net.remote.name, S.oppColor, G.opp);
  if (unlocked) html += `<div class="note">🔓 Level ${p.level} terbuka!</div>`;
  else if (p.role === 'child' && S.level === p.level && p.level < LEVELS.length) html += `<p class="muted">Butuh ${CONFIG.NAIK_LEVEL_MIN} jawaban benar untuk membuka level berikutnya.</p>`;
  if (p.role === 'child') html += `<p class="wallet">⭐ Tabungan: ${fmt(p.wallet)} poin</p>`;
  $('resBody').innerHTML = html;
  if (net.isHost || !G.race) api('riwayat', { kode: p.kode, room: G.race ? net.code : 'SOLO', pemain1: p.name, pemain2: G.race ? net.remote.name : '-', level: S.level, poin1: G.my.total, poin2: G.race ? G.opp.total : '', juara });
  if (unlocked && (net.isHost || !G.race)) S.level = p.level;
  $('btnAgain').textContent = G.race && !net.isHost ? 'Kembali ke Lobi' : 'Main Lagi';
  S.game = null; show('sResult');
}
function quitGame() {
  if (!confirm('Keluar dari permainan?')) return;
  if (net.peer) send({ t: 'leave' });
  S.game = null; enterMenu();
}

/* ===================== Toko & Lemari ===================== */
function renderShop() {
  const p = S.profile; $('shopWallet').textContent = `⭐ Tabungan: ${fmt(p.wallet)} poin`;
  const g = $('shopGrid'); g.innerHTML = '';
  SHOP.forEach(it => {
    const own = p.owned.includes(it.id), d = document.createElement('div');
    d.className = 'item' + (own ? ' eq' : '');
    d.innerHTML = `<div class="ic">${it.icon}</div><div class="nm">${esc(it.name)}</div><div class="pr">${it.price} poin</div>`;
    const b = document.createElement('button'); b.className = 'btn ' + (own ? 'gray' : 'green');
    b.textContent = own ? 'Dimiliki ✔' : (p.wallet < it.price ? `Kurang ${fmt(it.price - p.wallet)}` : 'Beli');
    b.disabled = own || p.wallet < it.price; b.onclick = () => buy(it); d.appendChild(b); g.appendChild(d);
  });
}
function buy(it) {
  const p = S.profile; if (p.owned.includes(it.id) || p.wallet < it.price) return;
  p.wallet = Math.max(0, p.wallet - it.price); p.owned.push(it.id); p.equipped[it.slot] = it.id;
  me.setOutfit(p.equipped); me.celebrate(); savePlayer(); toast(`${it.icon} ${it.name} langsung dipakai!`); renderShop();
}
function renderWardrobe() {
  const p = S.profile, g = $('wardGrid'); g.innerHTML = '';
  if (!p.owned.length) { g.innerHTML = '<p class="muted">Belum ada barang. Kumpulkan poin lalu beli di Toko!</p>'; return; }
  p.owned.forEach(id => {
    const it = ITEM[id]; if (!it) return; const on = p.equipped[it.slot] === id, d = document.createElement('div');
    d.className = 'item' + (on ? ' eq' : '');
    d.innerHTML = `<div class="ic">${it.icon}</div><div class="nm">${esc(it.name)}</div><div class="pr">${on ? 'Dipakai ✔' : 'Ketuk untuk pakai'}</div>`;
    d.onclick = () => { if (on) delete p.equipped[it.slot]; else p.equipped[it.slot] = id; me.setOutfit(p.equipped); savePlayer(); renderWardrobe(); };
    g.appendChild(d);
  });
}

/* ===================== Tombol ===================== */
$('roleParent').onclick = () => pickRole('parent');
$('roleChild').onclick = () => pickRole('child');
$('btnLogin').onclick = doLogin;
$('inKode').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('btnSolo').onclick = () => { leaveNet(); enterLobby(); };
$('btnCreate').onclick = () => { leaveNet(); toast('Membuat room...'); createRoom(); };
$('btnJoinMenu').onclick = () => { $('joinErr').textContent = ''; $('inRoom').value = ''; show('sJoin'); };
$('btnJoin').onclick = () => { const c = $('inRoom').value.replace(/\D/g, ''); if (c.length !== 4) { $('joinErr').textContent = 'Kodenya 4 angka'; return; } joinRoom(c); };
$('inRoom').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); });
$('btnJoinBack').onclick = () => { clearTimeout(joinTimer); enterMenu(); };
$('btnStart').onclick = hostStart;
$('btnLobbyBack').onclick = () => { if (net.peer) send({ t: 'leave' }); enterMenu(); };
$('btnAgain').onclick = () => { if (net.peer && !net.remote && !net.isHost) enterMenu(); else enterLobby(); };
$('btnResMenu').onclick = () => { if (net.peer) send({ t: 'leave' }); enterMenu(); };
$('btnShop').onclick = () => { renderShop(); show('sShop'); };
$('btnWardrobe').onclick = () => { renderWardrobe(); show('sWardrobe'); };
$('btnShopBack').onclick = enterMenu; $('btnWardBack').onclick = enterMenu;
$('btnLogout').onclick = () => { leaveNet(); S.profile = null; S.mode = 'login'; me.label.visible = false; me.setOutfit({}); show('sLogin'); };
$('btnMusic').onclick = () => music.toggle();
$('btnExit').onclick = quitGame;
try { const last = JSON.parse(localStorage.getItem('lbs_last') || 'null'); if (last) { $('inName').value = last.name || ''; $('inKode').value = last.kode || ''; if (last.role) pickRole(last.role); } } catch (e) { }

/* ===================== Loop utama ===================== */
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3(), desired = new THREE.Vector3(), look = new THREE.Vector3(0, 0.3, 4);
let last = performance.now(), posT = 0;
function updatePlay(dt) {
  const G = S.game; if (!G) return;
  if (G.phase === 'countdown') {
    G.cd -= dt; const n = Math.ceil(G.cd);
    if (n !== G.lastCd && n > 0) { G.lastCd = n; bigShow(String(n)); }
    if (G.cd <= 0) { G.phase = 'run'; bigShow('Mulai!', '', '#ffd43b', 600); }
  }
  const canMove = G.phase === 'run' && !G.locked;
  const inp = canMove ? getInput() : { x: 0, z: 0 }, sp = Math.hypot(inp.x, inp.z);
  if (sp > 0.05) {
    me.g.position.x = Math.max(-12, Math.min(12, me.g.position.x + inp.x * CONFIG.SPEED * dt));
    me.g.position.z = Math.max(-11, Math.min(13, me.g.position.z - inp.z * CONFIG.SPEED * dt));
    me.rotTarget = Math.atan2(inp.x, -inp.z);
  }
  me.speed = sp;
  if (wantJump) { wantJump = false; if (me.jump()) jumpFlag = true; }
  const cur = padAt(me.g.position);
  if (canMove) {
    if (cur && me.y < 0.05) { G.lockT += dt; if (G.lockT >= CONFIG.LOCK_TIME) lock(cur); }
    else G.lockT = Math.max(0, G.lockT - dt * 2);
    $('lockbar').style.display = G.lockT > 0 && !G.locked ? 'block' : 'none';
    $('lockfill').style.width = Math.min(100, G.lockT / CONFIG.LOCK_TIME * 100) + '%';
  }
  for (const k in padObjs) padObjs[k].userData.top.emissive.setHex(cur === k && G.phase !== 'show' ? 0x333333 : 0x000000);
  if (G.phase === 'show') { G.showT -= dt; if (G.showT <= 0) { G.phase = 'idle'; if (!G.race || net.isHost) nextOrEnd(); } }
  if (G.race) {
    remote.g.position.lerp(remoteTarget, 1 - Math.exp(-15 * dt)); remote.rotTarget = remoteRot;
    posT -= dt; if (posT <= 0) { posT = 0.066; send({ t: 'pos', x: +me.g.position.x.toFixed(2), z: +me.g.position.z.toFixed(2), r: +me.rotTarget.toFixed(2), s: +me.speed.toFixed(2), j: jumpFlag }); jumpFlag = false; }
  }
  const p = me.g.position, tx = p.x * 0.5;
  desired.set(tx, 13, p.z + 11); camera.position.lerp(desired, 1 - Math.exp(-4 * dt));
  look.lerp(tmp.set(tx, 0, p.z - 8), 1 - Math.exp(-4 * dt)); camera.lookAt(look);
}
function updateShowcase(dt) {
  S.showT += dt; const both = (S.mode === 'lobby' || S.mode === 'result') && !!net.remote;
  me.g.position.lerp(tmp.set(both ? -1.4 : 0, 0, 4), 1 - Math.exp(-6 * dt)); me.rotTarget = Math.sin(S.showT * 0.6) * 0.35; me.speed = 0;
  remote.setVisible(both);
  if (both) { remote.g.position.lerp(tmp2.set(1.4, 0, 4), 1 - Math.exp(-6 * dt)); remote.rotTarget = -Math.sin(S.showT * 0.6) * 0.35; remote.speed = 0; }
  if (wantJump) { wantJump = false; me.jump(); }
  for (const k in padObjs) padObjs[k].userData.top.emissive.setHex(0);
  desired.set(Math.sin(S.showT * 0.25) * 1.2, 2.6, 10.5); camera.position.lerp(desired, 1 - Math.exp(-3 * dt));
  look.lerp(tmp.set(0, 0.3, 4), 1 - Math.exp(-3 * dt)); camera.lookAt(look);
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pollGamepad();
  if (S.mode === 'play') updatePlay(dt); else updateShowcase(dt);
  me.update(dt); if (remote.g.visible) remote.update(dt);
  updateParticles(dt);
  renderer.render(scene, camera);
}

try { await document.fonts.ready; } catch (e) { }
buildPads(); buildTheme(S.theme);
requestAnimationFrame(loop);
</script>
</body>
